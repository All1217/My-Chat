# My-Chat：复用宿主机已有 pg 容器，Compose 跑 app + nginx + 常驻 crawler（可选关）
# 可选：--profile jenkins | --profile ops（dozzle 日志 + adminer 查库）
# 用法（在仓库根 /data/my-chat/repo）：
#   docker compose -f deploy/docker-compose.yml --env-file /data/my-chat/.env up -d

name: my-chat

services:
  # 爬虫 MCP：仅 Docker 内网 :8103，不对公网映射；纸面搜集经 PaperCrawlerClient 软依赖
  crawler:
    build:
      context: ../mcp-server-crawler
      dockerfile: Dockerfile
      args:
        # 云上慢/超时可改 .env：PIP_INDEX_URL / PIP_TRUSTED_HOST
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    image: my-chat-crawler:local
    restart: unless-stopped
    expose:
      - "8103"
    # 运维本机探活时可临时取消注释（勿对公网防火墙放行）：
    # ports:
    #   - "127.0.0.1:8103:8103"
    environment:
      CRAWLER_HOST: "0.0.0.0"
      CRAWLER_PORT: "8103"
    mem_limit: 384m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8103),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: my-chat-app:local
    restart: unless-stopped
    depends_on:
      crawler:
        condition: service_started
    extra_hosts:
      # 访问宿主机上已运行的 pg（docker run --name pg -p 5432:5432 ...）
      - "host.docker.internal:host-gateway"
    environment:
      PGSQL_PASS: ${PGSQL_PASS}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/mychat?currentSchema=public}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL_API_KEY: ${EMBEDDING_MODEL_API_KEY}
      # 默认只开 crawler MCP；database / Smithery 云上关闭
      APP_MCP_ENABLED: ${APP_MCP_ENABLED:-true}
      APP_MCP_DATABASE_ENABLED: ${APP_MCP_DATABASE_ENABLED:-false}
      APP_MCP_CRAWLER_ENABLED: ${APP_MCP_CRAWLER_ENABLED:-true}
      APP_MCP_SMITHERY_ENABLED: ${APP_MCP_SMITHERY_ENABLED:-false}
      MCP_CRAWLER_URL: ${MCP_CRAWLER_URL:-http://crawler:8103}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SMITHERY_API_KEY: ${SMITHERY_API_KEY:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # 评估员发信；密码只放服务器 .env，未配齐则接口返回 SKIPPED
      PAPER_MAIL_HOST: ${PAPER_MAIL_HOST:-smtp.qq.com}
      PAPER_MAIL_PORT: ${PAPER_MAIL_PORT:-587}
      PAPER_MAIL_USER: ${PAPER_MAIL_USER:-}
      PAPER_MAIL_PASS: ${PAPER_MAIL_PASS:-}
      APP_WORKSPACE_ROOT: /data/workspace
      APP_INGEST_ROOT: /data/ingest
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
    volumes:
      - ${MYCHAT_DATA:-/data/my-chat}/workspace:/data/workspace
      - ${MYCHAT_DATA:-/data/my-chat}/ingest:/data/ingest
    expose:
      - "8100"
    mem_limit: 1024m

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: my-chat-web:local
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    mem_limit: 128m

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    user: root
    environment:
      JAVA_OPTS: -Xmx512m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${MYCHAT_DATA:-/data/my-chat}/jenkins_home:/var/jenkins_home
      # sock + 宿主机 CLI（官方 jenkins 镜像不含 docker 命令）
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - ${MYCHAT_REPO:-/data/my-chat/repo}:/data/my-chat/repo
      - ${MYCHAT_ENV_FILE:-/data/my-chat/.env}:/data/my-chat/.env:ro
    mem_limit: 1024m
    profiles:
      - jenkins

  # 容器日志 Web UI（仅本机 + SSH 隧道，不对公网开放）
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8888:8080"
    mem_limit: 128m
    profiles:
      - ops

  # 数据库可视化（仅本机 + SSH 隧道；连宿主机 pg 的 mychat 库）
  adminer:
    image: adminer:4
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8889:8080"
    mem_limit: 128m
    profiles:
      - ops
