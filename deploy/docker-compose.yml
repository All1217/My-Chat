# My-Chat：复用宿主机已有 pg 容器，Compose 只跑 app + nginx（+ 可选 jenkins）
# 用法（在仓库根 /data/my-chat/repo）：
#   docker compose -f deploy/docker-compose.yml --env-file /data/my-chat/.env up -d

name: my-chat

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: my-chat-app:local
    restart: unless-stopped
    extra_hosts:
      # 访问宿主机上已运行的 pg（docker run --name pg -p 5432:5432 ...）
      - "host.docker.internal:host-gateway"
    environment:
      PGSQL_PASS: ${PGSQL_PASS}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/mychat?currentSchema=public}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL_API_KEY: ${EMBEDDING_MODEL_API_KEY}
      APP_MCP_ENABLED: ${APP_MCP_ENABLED:-false}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SMITHERY_API_KEY: ${SMITHERY_API_KEY:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APP_WORKSPACE_ROOT: /data/workspace
      APP_INGEST_ROOT: /data/ingest
    volumes:
      - ${MYCHAT_DATA:-/data/my-chat}/workspace:/data/workspace
      - ${MYCHAT_DATA:-/data/my-chat}/ingest:/data/ingest
    expose:
      - "8100"
    mem_limit: 1024m

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: my-chat-web:local
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    mem_limit: 128m

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    user: root
    environment:
      JAVA_OPTS: -Xmx512m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${MYCHAT_DATA:-/data/my-chat}/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MYCHAT_REPO:-/data/my-chat/repo}:/data/my-chat/repo
      - ${MYCHAT_ENV_FILE:-/data/my-chat/.env}:/data/my-chat/.env:ro
    mem_limit: 1024m
    profiles:
      - jenkins
