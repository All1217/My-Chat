[project]
name = "mcp-server-crawler"
version = "0.1.0"
description = "My-Chat 基础设施网页抓取 MCP（Streamable HTTP :8103）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "lxml_html_clean>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mcp-crawler = "crawler_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
