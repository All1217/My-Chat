server:
  port: 8102
  address: 0.0.0.0

spring:
  application:
    name: mcp-server-database
  # 用 DB_TYPE=postgres|mysql 切换；日常勿手改本文件，双击 start-*.bat 即可
  profiles:
    active: ${DB_TYPE:postgres}
  ai:
    mcp:
      server:
        name: mcp-database-server
        version: 1.1.0
        type: SYNC
        protocol: STREAMABLE
        request-timeout: 30s
        annotation-scanner:
          enabled: true

app:
  database:
    # 默认只读；设为 false 才允许写操作（仍禁止多语句与 DROP DATABASE 等危险语句）
    read-only: true
    max-rows: 200
    query-timeout-seconds: 15
    # 单单元格字符串截断长度
    max-cell-length: 500
    # 响应 connection.label；标明本地开发库
    connection-label: local
    # 列名包含以下子串则脱敏（大小写不敏感）
    sensitive-column-patterns:
      - api_key
      - password
      - secret
      - token
      - credential
