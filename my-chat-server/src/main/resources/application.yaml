server:
  port: 8100
  address: 0.0.0.0
spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  application:
    name: my-chat
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: deepseek-chat
          max-tokens: 4096
          extra-body:
            thinking:
              type: disabled
      client:
        connect-timeout: 15s
        read-timeout: 120s
  datasource:
    url: jdbc:h2:file:./data/mychatdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: root
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always
      continue-on-error: true
logging:
  level:
    org.springframework.ai: debug
    com.mychat: debug
    org.springframework.web.reactive.function.client.ExchangeFunctions: trace   # ← 新增：打印完整 HTTP 报文
app:
  ffmpeg:
    use-embedded: true
    cleanup-temp-on-exit: true