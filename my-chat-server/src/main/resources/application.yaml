server:
  port: 8100
  address: 0.0.0.0
spring:
  datasource:
    #    url: jdbc:mysql://localhost:3306/db01?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&useServerPrepStmts=false
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    #    username: root
    #    password: ${MYSQL_PASS}
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=public
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${PGSQL_PASS}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    async:
      # SSE 长连接；默认几十秒会掐断 /ai/jobs/events
      request-timeout: 24h
  application:
    name: my-chat
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
          max-tokens: 8192
          extra-body:
            thinking:
              type: disabled
      embedding:
        enabled: true
        base-url: https://ws-1b3a82l7nb8ysi9i.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${EMBEDDING_MODEL_API_KEY}
        options:
          model: text-embedding-v4
          dimensions: 1536
      client:
        connect-timeout: 10s
        read-timeout: 600s
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
    mcp:
      client:
        enabled: true
        type: SYNC
        # 远程 Smithery / Exa 搜索可能较慢，适当放宽超时
        request-timeout: 60s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            mcp-weather-server:
              # url 为服务根地址；endpoint 默认 /mcp，显式写出避免歧义
              url: http://localhost:8101
              endpoint: /mcp
            # Smithery 工具箱 Namespace MCP Endpoint（含 Exa Search 等）
            # 切勿把完整 URL 写到 url 且留下默认 endpoint=/mcp，否则会请求到 .../2625705206/mcp
            smithery-toolbox:
              url: https://mcp.smithery.run
              endpoint: /2625705206
logging:
  level:
    org.springframework.ai: debug
    com.mychat: debug
    org.springframework.web.reactive.function.client.ExchangeFunctions: trace
app:
  workspace:
    root: ./src/main/resources/workspace
  jobs:
    # 启动时把超过此时长仍为 PENDING/RUNNING 的任务标 FAILED
    stale-minutes: 10
  ingest:
    # 与 workspace 分开，避免 Agent 文件工具摸到用户原文
    root: ./src/main/resources/ingest
    max-file-size-mb: 50
    max-files-per-request: 20
    embed-batch-size: 32
    allowed-extensions: pdf,docx,xlsx,html,htm,txt,md
  # 本地 searchWeb：Exa REST → Bocha → Tavily → DuckDuckGo
  # EXA_API_KEY 必须来自 https://dashboard.exa.ai/api-keys ，不要填 SMITHERY_API_KEY
  search:
    exa:
      api-key: ${EXA_API_KEY:}
    bocha:
      api-key: ${BOCHA_API_KEY:}
    tavily:
      api-key: ${TAVILY_API_KEY:}
  mcp:
    smithery:
      # 从 https://smithery.ai/account/api-keys 获取，通过环境变量注入，勿写死进仓库
      api-key: ${SMITHERY_API_KEY}
      connection-name: smithery-toolbox
