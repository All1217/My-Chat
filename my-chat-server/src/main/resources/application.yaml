server:
  port: 8100
  address: 0.0.0.0
spring:
  datasource:
    #    url: jdbc:mysql://localhost:3306/db01?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&useServerPrepStmts=false
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    #    username: root
    #    password: ${MYSQL_PASS}
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=public
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${PGSQL_PASS}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    validate-on-migrate: true
    clean-disabled: true
    # 现有非空库首次接管时临时设为 true；完成后恢复 false。
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    # 现有库已具备 V1-V3 的完整结构，从版本 3 后继续增量迁移。
    baseline-version: "3"
  sql:
    init:
      # 数据库结构只由 Flyway 管理，禁止 Spring SQL 初始化器重复执行。
      mode: never
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    async:
      # SSE 长连接；默认几十秒会掐断 /ai/jobs/events
      request-timeout: 24h
  application:
    name: my-chat
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: deepseek-flash
          max-tokens: 8192
          extra-body:
            thinking:
              type: disabled
      embedding:
        enabled: true
        base-url: https://ws-1b3a82l7nb8ysi9i.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${EMBEDDING_MODEL_API_KEY}
        options:
          model: text-embedding-v4
          dimensions: 1536
      client:
        connect-timeout: 10s
        read-timeout: 600s
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
    mcp:
      client:
        # 与 app.mcp.enabled / APP_MCP_ENABLED 对齐；关闭后不创建任何 McpSyncClient
        enabled: ${APP_MCP_ENABLED:true}
        type: SYNC
        # 默认 true 会在创建 mcpSyncClients 时对每个连接 initialize()；
        # Smithery 404 / 天气服务未起时整条 Bean 链失败，主聊天无法启动。
        # 改为惰性握手：listTools / 首次调用再 initialize，单连接失败由 TolerantMcpToolCallbackProvider 跳过。
        initialized: false
        # 远程 Smithery / Exa 搜索可能较慢，适当放宽超时
        request-timeout: 60s
        # 关闭 Spring AI 默认 ToolCallbackProvider，只走自研 Tolerant（见 com.mychat.mcp）
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            mcp-weather-server:
              # url 为服务根地址；endpoint 默认 /mcp，显式写出避免歧义
              url: http://localhost:8101
              endpoint: /mcp
            # Smithery 工具箱 Namespace MCP Endpoint（含 Exa Search 等）
            # 切勿把完整 URL 写到 url 且留下默认 endpoint=/mcp，否则会请求到 .../2625705206/mcp
            smithery-toolbox:
              url: https://mcp.smithery.run
              endpoint: /2625705206
logging:
  level:
    org.springframework.ai: debug
    com.mychat: debug
    org.springframework.web.reactive.function.client.ExchangeFunctions: trace
app:
  market:
    strategy-file: ./data/market-strategy.json
    watchlist-file: ./data/market-watchlist.json
    crash-risk-file: ./data/market-crash-risk.json
    index-pe-file: ./data/market-index-pe.json
  paper-trade:
    # 模拟盘初始资金（虚拟，非实盘）
    initial-cash: 20000
    commission-rate: 0.0003
    min-commission: 5
    stamp-duty-rate: 0.0005
    risk-budget-pct: 0.02
    risk-budget-tight-pct: 0.01
    drawdown-restrict-pct: 0.08
    loss-streak-limit: 3
    buy-pause-days: 2
    min-avg-amount-stock: 50000000
    min-avg-amount-etf: 30000000
    min-listed-bars-stock: 60
    min-listed-bars-etf: 20
    commission-to-profit-max: 0.20
    auto-execute: true
    review-confidence-threshold: 0.55
    max-positions: 2
    max-single-allocation: 0.95
    schedule-enabled: true
    schedule-cron: "0 35 15 * * MON-FRI"
    # 云服务器系统时区经常是 UTC，定时按上海时间解释
    schedule-zone: Asia/Shanghai
    research-schedule-enabled: false
    research-schedule-cron: "0 10 15 * * MON-FRI"
    research-skip-days: 3
    research-batch-size: 15
    research-keep-limit: 8
    research-context-limit: 15
    require-etf-premium: true
    max-etf-premium-pct: 2.0
    max-qdii-premium-pct: 1.5
    fallback-symbols: "513100,159941,510300"
  workspace:
    root: ./src/main/resources/workspace
  jobs:
    # 启动时把超过此时长仍为 PENDING/RUNNING 的任务标 FAILED
    stale-minutes: 10
  ingest:
    # 知识库源文件存档目录，生产环境换成磁盘其他目录
    # 与 workspace 分开，避免 Agent 文件工具摸到用户原文
    root: ./src/main/resources/ingest
    max-file-size-mb: 50
    max-files-per-request: 20
    embed-batch-size: 32
    allowed-extensions: pdf,docx,xlsx,html,htm,txt,md
  mcp:
    # 总开关；他机无 MCP 环境时可设 APP_MCP_ENABLED=false，主聊天仍可启动
    enabled: ${APP_MCP_ENABLED:true}
    weather:
      enabled: true
      connection-name: mcp-weather-server
    smithery:
      enabled: true
      # 缺省为空串，避免未设环境变量时 Spring 属性解析失败拖垮启动
      # 从 https://smithery.ai/account/api-keys 获取，通过环境变量注入，勿写死进仓库
      api-key: ${SMITHERY_API_KEY:}
      connection-name: smithery-toolbox
  search:
    # 联网搜索走供应商 REST，不经 mcp.smithery.run（该网关 listTools 500 / callTool 403）
    # EXA_API_KEY 必须来自 https://dashboard.exa.ai/api-keys，不要填 SMITHERY_API_KEY
    exa:
      api-key: ${EXA_API_KEY:}
      base-url: https://api.exa.ai
    bocha:
      api-key: ${BOCHA_API_KEY:}
      base-url: https://api.bocha.cn
    tavily:
      api-key: ${TAVILY_API_KEY:}
      base-url: https://api.tavily.com
