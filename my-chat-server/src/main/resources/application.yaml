server:
  port: 8100
  address: 0.0.0.0
spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  application:
    name: my-chat
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: deepseek-v4-pro
          max-tokens: 4096
          extra-body:
            thinking:
              type: disabled
      embedding:
        enabled: true
        options:
          model: text-embedding-v4
          base-url: https://ws-lmxmf1i0bbkq5lo1.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
          api-key: ${EMBEDDING_MODEL_API_KEY}
      client:
        connect-timeout: 10s
        read-timeout: 600s
    vectorstore:
      simple:
        file-path: ./data/vectorstore.json
  datasource:
    url: jdbc:mysql://localhost:3306/db01?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&useServerPrepStmts=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASS}
#  sql:
#    init:
#      schema-locations: classpath:schema.sql
#      mode: always
#      continue-on-error: true
logging:
  level:
    org.springframework.ai: debug
    com.mychat: debug
    org.springframework.web.reactive.function.client.ExchangeFunctions: trace
app:
  ffmpeg:
    use-embedded: true
    cleanup-temp-on-exit: true
  workspace:
    root: ./my-chat-server/src/main/resources/workspace